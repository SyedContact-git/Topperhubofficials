[build]
  command = "npm run build"
  publish = "dist"

# API proxy to bypass CORS - must come before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "https://apiserver-jwex.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
