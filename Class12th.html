<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topper Hub</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; font-weight: bold; }
        body { background-color:Black; overflow-x: hidden; text-align: center; }

        #particles-js { 
            position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; 
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .title { font-size: 28px; display: flex; align-items: center; gap: 10px; }
        .title .topper { color: white; }
        .title .hub { background-color: orange; color: white; padding: 5px 10px; border-radius: 5px; }

        /* Glowing Batch Heading */
        .batches-heading {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(45deg, cyan, violet, lightblue);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow { 
            0% { text-shadow: 0 0 10px cyan; } 
            100% { text-shadow: 0 0 25px violet; } 
        }

        /* Batch Container */
        .batch-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-bottom: 50px;
        }

        /* Glass Effect Batch Card */
        .batch-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            width: 320px;
            height: 380px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            transition: 0.3s ease-in-out;
        }

        .batch-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .batch-thumbnail { width: 100%; border-radius: 10px; }
        .batch-title { color: white; font-size: 18px; }

        /* Stylish Animated Button */
        .button {
            background: linear-gradient(45deg, #00aaff, #0077ff);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.8);
        }

        .button:hover {
            background: linear-gradient(45deg, #0077ff, #00aaff);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 170, 255, 1);
        }

        /* Footer */
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 16px;
            margin-top: 40px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .content { padding-top: 120px; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <!-- Header -->
    <header>
        <div class="title">
            <span class="topper">Topper</span>
            <span class="hub">Hub</span>
        </div>
    </header>

    <div class="content">
        <!-- Class 12th Batches Heading -->
        <div class="batches-heading">CLASS 12TH BATCHES</div>

        <div class="batch-container">
            <!-- Humanities Batch -->
            <div class="batch-card">
                <img src="https://i.ibb.co/rKTQf66k/1000067197.jpg" class="batch-thumbnail">
                <div class="batch-title">PRARAMBH BATCH HUMANITIES</div>
                <a href="Comingsoon.html" class="button">LET'S START</a>
            </div>

            <!-- Commerce Batch -->
            <div class="batch-card">
                <img src="https://i.ibb.co/pv8ZsNq0/12th-Comm-1.jpg" class="batch-thumbnail">
                <div class="batch-title">PRARAMBH BATCH COMMERCE</div>
                <a href="Comingsoon.html" class="button">LET'S START</a>
                  </div>         <!-- Science Batch -->
            <div class="batch-card">
            
              <img src="https://i.ibb.co/FLZ1VQG6/122075828612-IMG-3069.jpg" class="batch-thumbnail">
                <div class="batch-title">PRARAMBH BATCH SCIENCE</div>
                <a href="Comingsoon.html" class="button">LET'S START</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        MADE WITH ❤️ BY TOPPER HUB
    </footer>

    <script>
        // Background Particles
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00acee" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 4, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#00acee", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 3 }
            }
        });
    </script>

</body>
</html>
