<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topper Hub</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            font-weight: bold;
        }

        body {
            background-color:black;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .black-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.6);
            text-align: center;
            width: 90%;
            max-width: 600px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .logo {
            width: 100%;
            max-width: 450px;
            border-radius: 10px;
            border: 2px solid white;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .select-class {
            color: white;
            font-size: 22px;
            margin-top: 15px;
        }

        .button {
            background: linear-gradient(90deg, #0077ff, #00aaff);
            color: white;
            border: none;
            padding: 15px;
            margin: 12px 0;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            width: 100%;
            max-width: 350px;
            border-radius: 8px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 119, 255, 0.8);
            font-weight: bold;
        }

        .button:hover {
            box-shadow: 0 0 25px rgba(0, 119, 255, 1);
            transform: scale(1.08);
        }

        /* Modern Popup Design */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 119, 255, 1);
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -55%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .popup h2 {
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
        }

        .popup-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .popup .popup-button {
            background: linear-gradient(90deg, #0077ff, #00aaff);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            border-radius: 8px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 119, 255, 0.8);
            text-decoration: none;
            font-weight: bold;
        }

        .popup .popup-button:hover {
            box-shadow: 0 0 20px rgba(0, 119, 255, 1);
            transform: scale(1.05);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: red;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="black-box">
        <div class="logo-container">
            <img src="https://i.ibb.co/B2YwVwDJ/IMG-20250306-120747-661.jpg" 
                 alt="Topper Hub Logo"
                 class="logo">
        </div>
        <p class="select-class">SELECT CLASS ✅</p>
        <button class="button" onclick="openPopup('popup9')">CLASS 10</button>
        <button class="button" onclick="openPopup('popup10')">CLASS 11</button>
        <button class="button" onclick="openPopup('popup11')">CLASS 12</button>
    </div>

    <!-- Pop-ups -->
    <div class="overlay" id="overlay" onclick="closePopup()"></div>

    <div class="popup" id="popup9">
        <span class="close-btn" onclick="closePopup()">✖</span>
        <h2>What do you want to explore? 😊</h2>
        <div class="popup-buttons">
            <a href="Class10th.html" class="popup-button">Explore Batches</a>
            <a href="Book.html" class="popup-button">Explore Books</a>
        </div>
    </div>

    <div class="popup" id="popup10">
        <span class="close-btn" onclick="closePopup()">✖</span>
        <h2>What do you want to explore? 😊</h2>
        <div class="popup-buttons">
            <a href="Class11th.html" class="popup-button">Explore Batches</a>
            <a href="Book.html" class="popup-button">Explore Books</a>
        </div>
    </div>

    <div class="popup" id="popup11">
        <span class="close-btn" onclick="closePopup()">✖</span>
        <h2>What do you want to explore? 😊</h2>
        <div class="popup-buttons">
            <a href="Class12th.html" class="popup-button">Explore Batches</a>
            <a href="Book.html" class="popup-button">Explore Books</a>
        </div>
    </div>

    <script>
        function openPopup(id) {
            document.getElementById(id).style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function closePopup() {
            document.querySelectorAll(".popup").forEach(popup => popup.style.display = "none");
            document.getElementById("overlay").style.display = "none";
        }

        particlesJS('particles-js', { "particles": { "number": { "value": 100 }, "color.  ": { "value": "#00acee" } } });
    </script>

</body>
</html>
