<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Team - Topper Hub</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000; /* Solid Black Background */
            color: white;
            overflow-x: hidden;
            text-align: center;
        }

        header {
            font-size: 2.5em;
            font-weight: 700;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px cyan, 0 0 20px blue;
            animation: headerGlow 1.5s infinite alternate;
        }

        @keyframes headerGlow {
            from { text-shadow: 0 0 15px cyan, 0 0 30px blue; }
            to { text-shadow: 0 0 25px cyan, 0 0 40px blue; }
        }

        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 280px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            transform: scale(0.9);
            transition: 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .team-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px cyan;
        }

        .team-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid cyan;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
        }

        .team-card:hover img {
            transform: scale(1.1);
            border-color: white;
            box-shadow: 0 0 25px white;
        }

        .name {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 15px;
            color: cyan;
            text-shadow: 0 0 10px cyan;
        }

        .role {
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.85;
            color: white;
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <header>🔥 Meet Our Team 🔥</header>

    <div class="team-container">
        <div class="team-card">
            <img src="https://i.ibb.co/TB4Ts4FV/IMG-20250319-094016.jpg" alt="Team Member">
            <div class="name">❍⏤𝗧𝗛𝗘 𝗢𝗪𝗡𝗘𝗥 </> 🗿</div>
            <div class="role">𝗣𝗥𝗢𝗨𝗗 𝗢𝗪𝗡𝗘𝗥</div>
        </div>
        <div class="team-card">
            <img src="https://i.ibb.co/21yJYFCq/IMG-20250319-093414-272.jpg" alt="Team Member">
            <div class="name">❍⏤𝗧𝗛𝗘 𝗖𝗨𝗕𝗜𝗫 </> 🗿</div>
            <div class="role">𝗪𝗘𝗕 𝗔𝗡𝗗 𝗧𝗛 𝗠𝗔𝗡𝗔𝗚𝗘𝗥</div>
        </div>
        <div class="team-card">
            <img src="https://i.ibb.co/MyHfs4ZM/IMG-20250319-093947.jpg" alt="Team Member">
            <div class="name">❍⏤𝗧𝗛𝗘 𝗟𝗘𝗔𝗗𝗘𝗥 </> 🗿</div>
            <div class="role">𝗠𝗔𝗥𝗞𝗘𝗧𝗜𝗡𝗚 𝗛𝗘𝗔𝗗</div>
        </div>
    </div>

</body>
</html>
